version: '3.8'

services:
  db-postgres:
    image: postgres:15-alpine
    container_name: lab_database
    environment:
      POSTGRES_DB: db_lab4web
      POSTGRES_USER: admin67
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"

  web-app:
    build: .
    container_name: lab4
    ports:
      - "8081:8080"
      - "9990:9990"
      - "9993:9993"
    command: [ "/opt/jboss/wildfly/bin/standalone.sh", "-b", "0.0.0.0", "-bmanagement", "0.0.0.0" ]
    environment:
      - DB_HOST=db-postgres
    depends_on:
      - db-postgres
